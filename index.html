<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Vamos! Spaans</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23c2410c%22/%3E%3Ctext x=%2250%22 y=%2272%22 font-size=%2266%22 font-weight=%22800%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Segoe UI,sans-serif%22%3E%C2%A1%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#c2410c">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body>
  <header class="top">
    <button class="brand" id="brand">¡Vamos!<span>Spaans oefenen</span></button>
    <div class="topstats" id="topstats"></div>
  </header>

  <main>
    <section id="home"></section>

    <section id="practice" hidden>
      <div class="pbar"><div id="pfill"></div></div>
      <div class="pmeta"><span id="pcount"></span><button class="link" id="stop">stoppen</button></div>
      <div class="card">
        <div class="badge" id="pbadge"></div>
        <div class="prompt" id="pprompt"></div>
        <div class="sub" id="psub"></div>
        <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Jouw antwoord">
        <div class="phint" id="phint" aria-live="polite"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </div>
      <div class="keys" id="keys"></div>
    </section>

    <section id="done" hidden></section>

    <section id="list" hidden></section>
  </main>

  <script src="data/words.js"></script>
  <script src="data/words.en.js"></script>
  <script src="data/verbs.js"></script>
  <script src="data/verbs.en.js"></script>
  <script src="data/sentences.js"></script>
  <script src="data/sentences.en.js"></script>
  <script src="js/conjugate.js"></script>
  <script src="js/check.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
